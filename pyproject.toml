[project]
name = "py-for-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nvinod007", email = "vinodkumar.nelanakula@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.37.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
py-for-ai = "py_for_ai:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]
